<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Brain — Linkage</title>
<style>
:root{--bg:#05070d;--panel:#0d1220;--line:#1d2538;--txt:#e3e9f7;--mut:#8b95ad;--acc:#6ea8fe}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;display:block;cursor:grab}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,5,.55) 100%)}
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#05070d;transition:opacity 1.1s ease;pointer-events:none}
#intro.gone{opacity:0}
#intro h1{font-size:44px;letter-spacing:14px;font-weight:200;color:#fff;text-shadow:0 0 40px rgba(110,168,254,.7)}
#intro p{color:var(--mut);letter-spacing:3px;font-size:12px;margin-top:10px;text-transform:uppercase}
#intro .counts{margin-top:26px;font-size:15px;letter-spacing:2px;color:var(--acc);font-variant-numeric:tabular-nums}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:8px 12px;
  background:rgba(5,7,13,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10;opacity:0;transition:opacity .8s}
body.ready #top{opacity:1}
#top b{font-size:14px;letter-spacing:3px;white-space:nowrap;font-weight:300}
#top input[type=text]{background:#0b1120;border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:6px;width:230px}
#top input:focus{outline:none;border-color:var(--acc)}
#panel{position:fixed;top:57px;left:0;bottom:0;width:264px;background:rgba(13,18,32,.94);backdrop-filter:blur(10px);
  border-right:1px solid var(--line);z-index:10;overflow-y:auto;padding:12px;transition:transform .18s,opacity .8s;opacity:0}
body.ready #panel{opacity:1}
#panel.hidden{transform:translateX(-100%)}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);margin:14px 0 6px}
#panel h3:first-child{margin-top:0}
.chip{display:inline-block;padding:3px 9px;margin:2px;border:1px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;user-select:none;background:#0b1120}
.chip.on{border-color:var(--acc);color:#fff}
.chip .n{color:var(--mut);font-size:11px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
button{background:#16203a;border:1px solid var(--line);color:var(--txt);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--acc)}
.row{display:flex;gap:6px;margin:4px 0;align-items:center;flex-wrap:wrap}
label.sl{display:grid;grid-template-columns:86px 1fr 34px;gap:6px;align-items:center;font-size:11px;color:var(--mut);margin:5px 0}
input[type=range]{width:100%}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.stat span:last-child{color:#fff}
.hub{cursor:pointer;color:var(--acc);font-size:12px;padding:2px 0;display:block}
.hub:hover{text-decoration:underline}
#tip{position:fixed;pointer-events:none;background:rgba(16,22,38,.88);backdrop-filter:blur(8px);
  border:1px solid border:1px solid #2a3552;border-radius:10px;padding:9px 12px;max-width:300px;z-index:20;display:none;font-size:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
#tip .tt{font-weight:600;margin-bottom:3px}
#tip .tm{color:var(--mut);font-size:11px;margin-bottom:4px}
#tip .ts{color:#c3ccdf}
#pathlist{font-size:12px}
#pathlist .step{padding:3px 0;cursor:pointer;color:var(--acc)}
#pathlist .step:hover{text-decoration:underline}
#statusbar{position:fixed;bottom:10px;right:12px;color:var(--mut);font-size:11px;z-index:10;background:rgba(5,7,13,.8);
  padding:4px 10px;border-radius:6px;border:1px solid var(--line);opacity:0;transition:opacity .8s}
body.ready #statusbar{opacity:1}
#hints{position:fixed;bottom:10px;left:276px;color:var(--mut);font-size:11px;z-index:9;opacity:0;transition:opacity .8s}
body.ready #hints{opacity:1}
#togglePanel{position:fixed;top:64px;left:8px;z-index:11;opacity:0;transition:opacity .8s}
body.ready #togglePanel{opacity:1}
#loadmsg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;color:var(--mut);font-size:14px;pointer-events:none}
.kbd{background:#16203a;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
</style>
</head>

<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="intro"><h1>LINKAGE</h1><p>the wiki brain, mapped</p><div class="counts" id="introcounts"></div></div>
<div id="top">

  <input type="text" id="search" list="nodelist" placeholder="search entries… (Enter = zoom)" autocomplete="off">
  <datalist id="nodelist"></datalist>
  <input type="text" id="pa" list="nodelist" placeholder="path from…" autocomplete="off" style="width:150px">
  <input type="text" id="pb" list="nodelist" placeholder="path to…" autocomplete="off" style="width:150px">
  <button id="findpath">shortest path</button>
  <button id="resetview">reset</button>
  <span id="counts" style="color:var(--mut);font-size:12px;margin-left:auto"></span>
</div>
<button id="togglePanel">☰</button>
<div id="panel">
  <h3>Layers</h3>
  <div class="row" id="kindchips"></div>
  <h3>Stats</h3>
  <div id="stats"></div>
  <h3>Top hubs</h3>
  <div id="hubs"></div>
  <h3>Groups — click to collapse</h3>
  <div id="groups"></div>
  <h3>Physics</h3>
  <label class="sl">repulsion <input type="range" id="rep" min="50" max="1500" value="520"><span id="repv">520</span></label>
  <label class="sl">link length <input type="range" id="ll" min="10" max="260" value="70"><span id="llv">70</span></label>
  <label class="sl">gravity <input type="range" id="gr" min="0" max="100" value="22"><span id="grv">.22</span></label>
  <label class="sl">damping <input type="range" id="da" min="80" max="99" value="90"><span id="dav">.90</span></label>
  <div class="row">
    <button id="pause">pause</button>
    <button id="reheat">reheat</button>
    <label style="font-size:11px;color:var(--mut)"><input type="checkbox" id="cluster" checked> cluster mode</label>
  </div>
  <h3>Shortest path</h3>
  <div id="pathlist"><span style="color:var(--mut)">pick two entries above</span></div>
</div>
<div id="tip"></div>
<div id="loadmsg">loading graph…</div>
<div id="statusbar"></div>
<div id="hints">drag node to move · click = isolate neighborhood · <span class="kbd">esc</span> = reset</div>

<script>
"use strict";
/* ================= data ================= */
const WIKI_NODES = WIKI_DATA.nodes, WIKI_EDGES = WIKI_DATA.edges;
const PALETTE = ["#6ea8fe","#7ee2a8","#f2c14e","#ef8354","#c792ea","#5dd6d0","#f28ba8","#9db4ff","#b8e26e","#e2a35a","#8ad0f2","#d18ce0"];
const KB_LAYER_NAMES = {0:"sources",1:"data",2:"entities",3:"interpretations",4:"patterns",5:"syntheses"};
const KB_LAYER_COLORS = {0:"#5dd6d0",1:"#6ea8fe",2:"#7ee2a8",3:"#f2c14e",4:"#ef8354",5:"#c792ea"};

let nodes=[], nodeById=new Map(), edges=[], adj=new Map();
let simNodes=[], simEdges=[], simAdj=new Map();
let collapsed=new Set(), showKB=true, showWiki=true, clusterMode=true;
let isolated=null, pathNodes=[], pathEdgeSet=new Set();

function groupOf(n){ return n.kind==="kb" ? ("kb·"+(KB_LAYER_NAMES[n.layer]||("layer "+n.layer))) : ("wiki·"+n.domain); }
function groupColor(n){
  // NB: must always return a 6-digit hex — the nebula code appends an alpha
  // byte (g.c+"22"). A 3-digit fallback ("#888") once produced "#88822",
  // which threw in addColorStop and killed the whole rAF loop: black canvas.
  if(n.kind==="kb") return KB_LAYER_COLORS[n.layer]||"#888888";
  const domains=["people","timeline","places","work","mind","legal","health","interests","self","meta","share"];
  const di=domains.indexOf(n.domain);
  return (di>=0?PALETTE[di%PALETTE.length]:null)||"#888888";
}

function addNode(n){
  n.deg=0;
  const a=Math.random()*Math.PI*2, r=Math.random()*60;
  n.x=Math.cos(a)*r; n.y=Math.sin(a)*r;
  const sp=60+Math.random()*160; // intro burst velocity
  n.vx=Math.cos(a)*sp; n.vy=Math.sin(a)*sp;
  nodeById.set(n.id,n); nodes.push(n); adj.set(n.id,new Set());
}
function addEdge(a,b){
  if(a===b) return;
  const na=nodeById.get(a), nb=nodeById.get(b);
  if(!na||!nb) return;
  const k=a<b?a+"|"+b:b+"|"+a;
  if(edgeSeen.has(k)) return; edgeSeen.add(k);
  na.deg++; nb.deg++;
  adj.get(a).add(b); adj.get(b).add(a);
  edges.push([a,b]);
}
const edgeSeen=new Set();

async function load(){
  for(const w of WIKI_NODES){
    addNode({id:w.k, label:w.t, kind:"wiki", domain:w.d||"meta",
      pageType:w.y||"", snippet:"", url:"../"+w.k.slice(5)+".html"});
  }
  for(const e of WIKI_EDGES) addEdge(e[0],e[1]);
  let kbFailed=false;
  try{
    const g=await (await fetch("../../graph.json")).json();
    for(const n of g.nodes){
      const file=(n.url||"").split("/").pop()||(n.id.replace(":","-")+".html");
      addNode({id:n.id, label:n.title||n.id, kind:"kb", layer:n.layer??1,
        type:n.type||"", snippet:(n.body||"").replace(/\s+/g," ").slice(0,200),
        url:"../../node/"+file, tags:n.tags||[]});
    }
    for(const n of g.nodes) for(const c of (n.cites||[])) addEdge(n.id,c);
  }catch(e){ kbFailed=true; console.warn("kb graph.json unavailable:", e); }
  rebuild(); buildPanel(); stats();
  startIntro(kbFailed);
  requestAnimationFrame(frame);
}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>

"use strict";
/* ================= simulation + cinematic camera ================= */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1, T0=performance.now();
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);
  buildBg();}
addEventListener("resize",resize);

const view={x:0,y:0,k:2.6};
const P={rep:520, ll:70, gr:.22, da:.90, running:true};
let settled=false, hovered=null, selected=null, dragging=null, panning=null;
let camAnim=null, introDone=false, userDrove=false, tickN=0;
// userDrove: any manual pan/zoom/drag (or a search/path zoom) hands the camera
// to the user permanently — auto-framing never fights them after that.
function frameAll(dur=1400,pad=0.70){ // crispness pass 2026-09-22: generous margin so the cloud breathes
  // hard-frame the whole node cloud to the viewport, whatever its size
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const s of simNodes){if(s.x<x0)x0=s.x;if(s.x>x1)x1=s.x;if(s.y<y0)y0=s.y;if(s.y>y1)y1=s.y;}
  if(x0>x1||!isFinite(x0)||!W||!H)return false;
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const k=Math.min(W/Math.max(1,x1-x0),H/Math.max(1,y1-y0))*pad;
  flyTo(cx,cy,Math.max(0.05,Math.min(k,4)),dur);
  return true;
}

function easeIO(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function flyTo(x,y,k,dur=1100){
  camAnim={fx:view.x,fy:view.y,fk:view.k,tx:x,ty:y,tk:k,t0:performance.now(),dur};
}
function stepCam(now){
  if(!camAnim)return;
  let t=(now-camAnim.t0)/camAnim.dur;
  if(t>=1){view.x=camAnim.tx;view.y=camAnim.ty;view.k=camAnim.tk;camAnim=null;return;}
  const e=easeIO(t);
  view.x=camAnim.fx+(camAnim.tx-camAnim.fx)*e;
  view.y=camAnim.fy+(camAnim.ty-camAnim.fy)*e;
  view.k=camAnim.fk+(camAnim.tk-camAnim.fk)*e;
}

/* background: cached deep-space gradient + starfield */
let bgCv=null;
const stars=[];
function buildBg(){
  bgCv=document.createElement("canvas");
  bgCv.width=Math.max(2,W);bgCv.height=Math.max(2,H);
  const b=bgCv.getContext("2d");
  const g=b.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);
  g.addColorStop(0,"#0a0f1d");g.addColorStop(.55,"#070b14");g.addColorStop(1,"#04060c");
  b.fillStyle=g;b.fillRect(0,0,W,H);
  if(!stars.length)for(let i=0;i<260;i++)stars.push({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.3,tw:Math.random()*7});
  for(const s of stars){b.globalAlpha=.25+.5*Math.abs(Math.sin(s.tw));b.fillStyle="#aebdd8";
    b.beginPath();b.arc(s.x*W,s.y*H,s.r,0,7);b.fill();}
  b.globalAlpha=1;
}

/* glow sprites, one per group color */
const sprites=new Map();
function glow(color){
  if(sprites.has(color))return sprites.get(color);
  const c=document.createElement("canvas");c.width=c.height=64;
  const x=c.getContext("2d");
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,color);g.addColorStop(.18,color+"d9");g.addColorStop(.45,color+"2e");g.addColorStop(1,color+"00"); // crispness pass: tight falloff, dot+halo not beach ball
  x.fillStyle=g;x.fillRect(0,0,64,64);
  sprites.set(color,c);return c;
}

function rebuild(){
  simNodes=[];simEdges=[];simAdj=new Map();
  const rep=new Map();
  const groupMembers=new Map();
  for(const n of nodes){
    if(n.kind==="kb"&&!showKB)continue;
    if(n.kind==="wiki"&&!showWiki)continue;
    const g=groupOf(n);
    if(collapsed.has(g)){
      if(!groupMembers.has(g))groupMembers.set(g,[]);
      groupMembers.get(g).push(n);continue;
    }
    const s=Object.assign({},n);
    rep.set(n.id,s);simNodes.push(s);simAdj.set(s.id,new Set());
  }
  for(const [g,members] of groupMembers){
    const s={id:"group:"+g,label:(g.split("·")[1]||g),kind:"super",gx:g,
      gc:groupColor(members[0]),deg:0,members:members.length,
      snippet:members.length+" entries collapsed — click the group chip to expand",
      url:null,x:0,y:0,vx:0,vy:0,super:true};
    let sx=0,sy=0,c=0;
    for(const m of members){sx+=m.x;sy+=m.y;c++;}
    if(c){s.x=sx/c;s.y=sy/c;}
    rep.set("group:"+g,s);simNodes.push(s);simAdj.set(s.id,new Set());
  }
  const seen=new Set();
  for(const [a,b] of edges){
    const na=nodeById.get(a),nb=nodeById.get(b);
    const ga=na?groupOf(na):null,gb=nb?groupOf(nb):null;
    const ra=rep.get(a)||(ga&&collapsed.has(ga)?rep.get("group:"+ga):null);
    const rb=rep.get(b)||(gb&&collapsed.has(gb)?rep.get("group:"+gb):null);
    if(!ra||!rb||ra===rb)continue;
    const k=ra.id<rb.id?ra.id+"|"+rb.id:rb.id+"|"+ra.id;
    if(seen.has(k))continue;seen.add(k);
    ra.deg++;rb.deg++;simAdj.get(ra.id).add(rb.id);simAdj.get(rb.id).add(ra.id);
    simEdges.push([ra,rb]);
  }
  for(const s of simNodes){s.gx=s.gx||groupOf(s);s.gc=s.gc||groupColor(s);}
  document.getElementById("counts").textContent=
    simNodes.length.toLocaleString()+" nodes · "+simEdges.length.toLocaleString()+" edges";
  settled=false;
}

function reheat(){
  for(const s of simNodes){s.vx+=(Math.random()-.5)*30;s.vy+=(Math.random()-.5)*30;}
  settled=false;P.running=true;document.getElementById("pause").textContent="pause";
}

const CELL=130;
function tick(){
  if(!P.running||settled)return;
  const n=simNodes.length;
  const grid=new Map();
  for(let i=0;i<n;i++){const s=simNodes[i];
    const k=((s.x/CELL)|0)+":"+((s.y/CELL)|0);
    let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(i);}
  const R2=CELL*CELL;
  for(let i=0;i<n;i++){const a=simNodes[i];
    const cx=(a.x/CELL)|0,cy=(a.y/CELL)|0;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      const cell=grid.get((cx+dx)+":"+(cy+dy));if(!cell)continue;
      for(const j of cell){if(j<=i)continue;const b=simNodes[j];
        const ddx=a.x-b.x,ddy=a.y-b.y,d2=ddx*ddx+ddy*ddy;
        if(d2>R2||d2<1)continue;
        const f=P.rep/d2,d=Math.sqrt(d2),fx=f*ddx/d,fy=f*ddy/d;
        a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
    }
  }
  for(const [a,b] of simEdges){
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const f=(d-P.ll)*0.02,fx=f*dx/d,fy=f*dy/d;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  const cent=new Map();
  if(clusterMode){
    for(const s of simNodes){let c=cent.get(s.gx);if(!c){c={x:0,y:0,n:0};cent.set(s.gx,c);}c.x+=s.x;c.y+=s.y;c.n++;}
    for(const c of cent.values()){c.x/=c.n;c.y/=c.n;}
  }
  let maxv=0;
  for(const s of simNodes){
    s.vx+=-s.x*P.gr*0.004;s.vy+=-s.y*P.gr*0.004;
    if(clusterMode){const c=cent.get(s.gx);if(c){s.vx+=(c.x-s.x)*0.004;s.vy+=(c.y-s.y)*0.004;}}
    s.vx*=P.da;s.vy*=P.da;
    const sp=Math.hypot(s.vx,s.vy),cap=80;
    if(sp>cap){s.vx*=cap/sp;s.vy*=cap/sp;}
    if(dragging!==s){s.x+=s.vx;s.y+=s.vy;}
    if(sp>maxv)maxv=sp;
  }
  if(maxv<0.08)settled=true;
  // while the burst cloud is still expanding, keep it framed (until the user
  // takes the camera or the layout settles) — fixes the black-screen-on-phone
  // bug where the fixed k=0.62 pull-back framed empty space on small viewports
  if(introDone&&!userDrove&&!settled&&(tickN++%45===0))frameAll(900);
  document.getElementById("statusbar").textContent=
    (settled?"settled":"simulating…")+" · "+simNodes.length.toLocaleString()+" nodes";
}

/* ---- intro ---- */
let introT0=0,introKbFailed=false;
function startIntro(kbFailed){
  introKbFailed=kbFailed;introT0=performance.now();
  resize();
  flyTo(0,0,0.62,3200); // cinematic pull-back
  const el=document.getElementById("introcounts");
  const N=nodes.length,M=edges.length,t0=performance.now();
  (function count(){
    const t=Math.min(1,(performance.now()-t0)/1800),e=easeIO(t);
    el.textContent=Math.round(N*e).toLocaleString()+" entries · "+Math.round(M*e).toLocaleString()+" links"+
      (kbFailed?" · kb offline":"");
    if(t<1&&!introDone)requestAnimationFrame(count);
  })();
  setTimeout(()=>{document.getElementById("intro").classList.add("gone");},2100);
  setTimeout(()=>{document.body.classList.add("ready");introDone=true;
    document.getElementById("intro").style.display="none";
    if(!userDrove)frameAll(1600);},3300); // hard-frame the cloud after the cinematic pull-back
}
</script>

<script>
"use strict";
/* ================= rendering ================= */
const tip=document.getElementById("tip");
function w2s(x,y){return [(x-view.x)*view.k+W/2,(y-view.y)*view.k+H/2];}
function s2w(px,py){return [(px-W/2)/view.k+view.x,(py-H/2)/view.k+view.y];}
function radius(s){return Math.max(2,Math.min(9,2+1.5*Math.sqrt(s.deg||0)))*(s.super?1.5:1);} // crispness pass 2026-09-22: hubs capped at 9, no more suns
function dimmed(s){
  if(isolated&&s.id!==isolated&&!simAdj.get(isolated)?.has(s.id))return true;
  if(pathNodes.length&&!pathNodes.includes(s.id))return true;
  return false;
}
function render(now){
  if(bgCv)ctx.drawImage(bgCv,0,0,W,H);else{ctx.fillStyle="#05070d";ctx.fillRect(0,0,W,H);}
  // nebula hulls per group
  if(clusterMode){
    const groups=new Map();
    for(const s of simNodes){if(dimmed(s))continue;
      let g=groups.get(s.gx);if(!g){g={x:0,y:0,n:0,c:s.gc,items:[]};groups.set(s.gx,g);}
      g.x+=s.x;g.y+=s.y;g.n++;g.items.push(s);}
    for(const [name,g] of groups){
      g.x/=g.n;g.y/=g.n;
      let r=0;for(const s of g.items)r=Math.max(r,Math.hypot(s.x-g.x,s.y-g.y)+radius(s));
      const [sx,sy]=w2s(g.x,g.y),rr=r*view.k+26;
      if(sx>-rr&&sx<W+rr&&sy>-rr&&sy<H+rr){
        const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,rr);
        gr.addColorStop(0,g.c+"18");gr.addColorStop(.7,g.c+"0a");gr.addColorStop(1,g.c+"00"); // crispness pass: faint background wash, never brighter than nodes
        ctx.fillStyle=gr;ctx.beginPath();ctx.arc(sx,sy,rr,0,7);ctx.fill();
        if(view.k>0.35){
          ctx.fillStyle=g.c+"aa";ctx.font="11px sans-serif";ctx.textAlign="center";
          ctx.fillText((name.split("·")[1]||name)+" · "+g.n,sx,sy-rr+16);
          ctx.textAlign="left";
        }
      }
    }
  }
  // edges
  for(const [a,b] of simEdges){
    const da=dimmed(a),db=dimmed(b);
    const onPath=pathEdgeSet.has(a.id<b.id?a.id+"|"+b.id:b.id+"|"+a.id);
    const [x1,y1]=w2s(a.x,a.y),[x2,y2]=w2s(b.x,b.y);
    if(Math.max(x1,x2)<-50||Math.min(x1,x2)>W+50||Math.max(y1,y2)<-50||Math.min(y1,y2)>H+50)continue;
    ctx.strokeStyle=onPath?"#ffd166":((da&&db)?"rgba(120,130,150,0.05)":"rgba(130,150,190,0.20)");
    ctx.lineWidth=onPath?2.2:1;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  // nodes: glow sprite + core
  for(const s of simNodes){
    const [x,y]=w2s(s.x,s.y);
    if(x<-30||x>W+30||y<-30||y>H+30)continue;
    const r=radius(s)*view.k,d=dimmed(s);
    ctx.globalAlpha=d?0.07:1;
    const gs=r*3.2; // crispness pass 2026-09-22: was r*6 (lava lamp)
    ctx.drawImage(glow(s.gc),x-gs/2,y-gs/2,gs,gs);
    ctx.beginPath();ctx.arc(x,y,Math.max(1.4,r*0.62),0,7);
    ctx.fillStyle=s.gc;ctx.fill();
    ctx.globalAlpha=1;
    const hot=(s===hovered||s===selected||pathNodes.includes(s.id));
    if(hot){
      const pulse=1+0.18*Math.sin(now/280);
      ctx.strokeStyle=s===hovered?"#ffffff":(pathNodes.includes(s.id)?"#ffd166":"#ffffff");
      ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x,y,Math.max(3,r+5)*pulse,0,7);ctx.stroke();
      ctx.fillStyle="#fff";ctx.font="600 12px sans-serif";
      const label=s.label.slice(0,64),tw=ctx.measureText(label).width;
      ctx.fillStyle="rgba(5,7,13,.75)";
      ctx.fillRect(x+10,y-24,tw+12,20);
      ctx.fillStyle="#fff";ctx.fillText(label,x+16,y-10);
    }
  }
  // path pulse rings
  if(pathNodes.length){
    for(const id of pathNodes){
      const s=simNodes.find(v=>v.id===id);if(!s)continue;
      const [x,y]=w2s(s.x,s.y),ph=(now/900)%1;
      ctx.strokeStyle=`rgba(255,209,102,${0.8*(1-ph)})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,(radius(s)*view.k+6)+ph*26,0,7);ctx.stroke();
    }
  }
}
function frame(now){
  requestAnimationFrame(frame); // scheduled FIRST so one bad frame can never kill the loop
  stepCam(now||performance.now());
  tick();render(now||performance.now());
}

/* ================= interaction ================= */
function nodeAt(px,py){
  const [wx,wy]=s2w(px,py);let best=null,bd=1e9;
  for(const s of simNodes){
    const d=Math.hypot(s.x-wx,s.y-wy);
    if(d<16/view.k+radius(s)&&d<bd){bd=d;best=s;}
  }
  return best;
}
cv.addEventListener("mousemove",e=>{
  if(panning){view.x-=(e.clientX-panning.x)/view.k;view.y-=(e.clientY-panning.y)/view.k;
    panning={x:e.clientX,y:e.clientY};camAnim=null;return;}
  if(dragging){const [wx,wy]=s2w(e.clientX,e.clientY);dragging.x=wx;dragging.y=wy;dragging.vx=dragging.vy=0;return;}
  hovered=nodeAt(e.clientX,e.clientY);
  cv.style.cursor=hovered?"pointer":"grab";
  if(hovered){
    const n=nodeById.get(hovered.id)||hovered;
    const meta=hovered.kind==="kb"
      ?`${hovered.type||""} · layer ${hovered.layer} (${KB_LAYER_NAMES[hovered.layer]||""}) · ${hovered.deg} links`
      :`${hovered.pageType||"article"} · ${hovered.domain||""} · ${hovered.deg} links`;
    tip.innerHTML=`<div class="tt">${esc(hovered.label)}</div><div class="tm">${esc(meta)}</div><div class="ts">${esc((n.snippet||hovered.snippet||"").slice(0,220))}</div>`;
    tip.style.display="block";
    tip.style.left=Math.min(W-320,e.clientX+14)+"px";
    tip.style.top=Math.min(H-150,e.clientY+14)+"px";
  }else tip.style.display="none";
});
cv.addEventListener("mousedown",e=>{
  userDrove=true; // manual drag/pan takes the camera
  const n=nodeAt(e.clientX,e.clientY);
  if(n){dragging=n;selected=n;}
  else panning={x:e.clientX,y:e.clientY};
});
addEventListener("mouseup",()=>{dragging=null;panning=null;});
cv.addEventListener("click",e=>{
  const n=nodeAt(e.clientX,e.clientY);
  isolated=n?(isolated===n.id?null:n.id):null;
});
/* double-click-to-open-entry removed 2026-09-22: on touch devices a burst of
   taps synthesized dblclicks, and window.open(...,"_blank") dropped each entry
   page into a fresh tab without the gate session key -> password overlay.
   Taps on this page must never navigate away. (Dan's order) */
cv.addEventListener("wheel",e=>{
  e.preventDefault();camAnim=null;userDrove=true; // manual zoom takes the camera
  e.preventDefault();camAnim=null;
  const f=e.deltaY<0?1.12:1/1.12,k2=Math.min(9,Math.max(0.08,view.k*f));
  const [wx,wy]=s2w(e.clientX,e.clientY);
  view.k=k2;view.x=wx-(e.clientX-W/2)/k2;view.y=wy-(e.clientY-H/2)/k2;
},{passive:false});
addEventListener("keydown",e=>{if(e.key==="Escape"){isolated=null;pathNodes=[];pathEdgeSet.clear();
  document.getElementById("pathlist").innerHTML='<span style="color:var(--mut)">pick two entries above</span>';}});
function zoomTo(s){
  selected=s;isolated=s.id;settled=false;userDrove=true; // programmatic zoom takes the camera
  flyTo(s.x,s.y,Math.max(view.k,1.7),900);
}
</script>

<script>
"use strict";
/* ================= panels ================= */
function stats(){
  const el=document.getElementById("stats");
  const kb=nodes.filter(n=>n.kind==="kb"),wk=nodes.filter(n=>n.kind==="wiki");
  const degs=nodes.map(n=>n.deg),avg=(degs.reduce((a,b)=>a+b,0)/Math.max(1,degs.length)).toFixed(1);
  const iso=nodes.filter(n=>n.deg===0).length;
  el.innerHTML=
    `<div class="stat"><span>entries</span><span>${nodes.length.toLocaleString()}</span></div>`+
    `<div class="stat"><span>kb nodes / wiki articles</span><span>${kb.length} / ${wk.length}</span></div>`+
    `<div class="stat"><span>links</span><span>${edges.length.toLocaleString()}</span></div>`+
    `<div class="stat"><span>avg degree</span><span>${avg}</span></div>`+
    `<div class="stat"><span>isolates</span><span>${iso}</span></div>`;
  const hubs=[...nodes].sort((a,b)=>b.deg-a.deg).slice(0,10);
  document.getElementById("hubs").innerHTML=hubs.map(h=>
    `<span class="hub" data-id="${esc(h.id)}">◈ ${esc(h.label.slice(0,44))} <span style="color:var(--mut)">(${h.deg})</span></span>`).join("");
  document.querySelectorAll(".hub").forEach(h=>h.onclick=()=>{
    const s=simNodes.find(x=>x.id===h.dataset.id);if(s)zoomTo(s);});
  const dl=document.getElementById("nodelist");
  const frag=nodes.map(n=>`<option value="${esc(n.label)}">`).join("");
  dl.innerHTML=frag;
}

function buildPanel(){
  const kc=document.getElementById("kindchips");
  kc.innerHTML=`<span class="chip on" id="chipKB"><span class="dot" style="background:#6ea8fe"></span>kb <span class="n">${nodes.filter(n=>n.kind==="kb").length}</span></span>
  <span class="chip on" id="chipWiki"><span class="dot" style="background:#7ee2a8"></span>wiki <span class="n">${nodes.filter(n=>n.kind==="wiki").length}</span></span>`;
  document.getElementById("chipKB").onclick=e=>{showKB=!showKB;e.currentTarget.classList.toggle("on",showKB);rebuild();};
  document.getElementById("chipWiki").onclick=e=>{showWiki=!showWiki;e.currentTarget.classList.toggle("on",showWiki);rebuild();};
  const groups=new Map();
  for(const n of nodes){const g=groupOf(n);
    if(!groups.has(g))groups.set(g,{c:groupColor(n),n:0});
    groups.get(g).n++;}
  const ge=document.getElementById("groups");
  ge.innerHTML=[...groups.entries()].sort((a,b)=>b[1].n-a[1].n).map(([g,v])=>
    `<span class="chip on" data-g="${esc(g)}"><span class="dot" style="background:${v.c}"></span>${esc(g.split("·")[1]||g)} <span class="n">${v.n}</span></span>`).join("");
  ge.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const g=c.dataset.g;
    collapsed.has(g)?collapsed.delete(g):collapsed.add(g);
    c.classList.toggle("on",!collapsed.has(g));
    rebuild();reheat();
  });
  const bind=(id,vid,fn,fmt)=>{const r=document.getElementById(id);
    r.oninput=()=>{fn(+r.value);document.getElementById(vid).textContent=fmt(+r.value);settled=false;};};
  bind("rep","repv",v=>P.rep=v,v=>v);
  bind("ll","llv",v=>P.ll=v,v=>v);
  bind("gr","grv",v=>P.gr=v/100,v=>"."+String(v).padStart(2,"0"));
  bind("da","dav",v=>P.da=v/100,v=>"."+v);
  document.getElementById("pause").onclick=e=>{P.running=!P.running;e.target.textContent=P.running?"pause":"run";};
  document.getElementById("reheat").onclick=reheat;
  document.getElementById("cluster").onchange=e=>{clusterMode=e.target.checked;settled=false;};
  document.getElementById("resetview").onclick=()=>{
    view.x=view.y=0;isolated=null;pathNodes=[];pathEdgeSet.clear();
    document.getElementById("pathlist").innerHTML='<span style="color:var(--mut)">pick two entries above</span>';
    userDrove=false;frameAll(1200);reheat();};
  document.getElementById("togglePanel").onclick=()=>document.getElementById("panel").classList.toggle("hidden");
  const byLabel=new Map();for(const n of nodes)byLabel.set(n.label.toLowerCase(),n);
  const doSearch=id=>{const q=document.getElementById(id).value.trim().toLowerCase();
    let n=byLabel.get(q);
    if(!n){const hits=nodes.filter(x=>x.label.toLowerCase().includes(q));n=hits[0];}
    return n||null;};
  document.getElementById("search").addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;
    const n=doSearch("search");if(!n)return;
    const s=simNodes.find(x=>x.id===n.id);if(s)zoomTo(s);
  });
  document.getElementById("findpath").onclick=()=>{
    const a=doSearch("pa"),b=doSearch("pb");
    if(!a||!b)return;
    const prev=new Map([[a.id,null]]),q=[a.id];
    while(q.length){const cur=q.shift();if(cur===b.id)break;
      for(const nb of(adj.get(cur)||[]))if(!prev.has(nb)){prev.set(nb,cur);q.push(nb);}}
    const pl=document.getElementById("pathlist");
    if(!prev.has(b.id)){pl.innerHTML='<span style="color:var(--mut)">no path found</span>';return;}
    const chain=[];let c=b.id;
    while(c){chain.unshift(c);c=prev.get(c);}
    pathNodes=chain;pathEdgeSet.clear();
    for(let i=0;i<chain.length-1;i++){const x=chain[i],y=chain[i+1];
      pathEdgeSet.add(x<y?x+"|"+y:y+"|"+x);}
    isolated=null;
    pl.innerHTML=`<div style="color:var(--mut);margin-bottom:4px">${chain.length-1} hops</div>`+
      chain.map((id,i)=>`<div class="step" data-id="${esc(id)}">${i+1}. ${esc((nodeById.get(id)||{}).label||id)}</div>`).join("");
    pl.querySelectorAll(".step").forEach(s=>s.onclick=()=>{
      const sn=simNodes.find(x=>x.id===s.dataset.id);if(sn)zoomTo(sn);});
    const mid=simNodes.find(x=>x.id===chain[Math.floor(chain.length/2)]);
    if(mid)zoomTo(mid);
  };
}

/* ================= boot ================= */
load();
</script>
